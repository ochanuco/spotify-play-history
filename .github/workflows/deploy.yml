name: deploy
run-name: deploy spotify-play-history @ ${{ inputs.ref || github.sha }}

# main への push で Worker を本番に出す。承認は deploy-plan が危ないと判定したとき（前回の記録なし・ロールバック）だけ、
# Environment production-approval で止まる。手動実行はロールバック用
on:
  push:
    branches: [main]
    paths:
      - worker/**
      - .github/deploy/worker.env.op
      - .github/workflows/deploy.yml
  workflow_dispatch:
    inputs:
      ref:
        description: デプロイする ref（main、または main 上のコミット SHA。古い SHA はロールバック）
        required: true
        default: main

permissions:
  contents: read

concurrency:
  group: deploy-run-production
  cancel-in-progress: false

jobs:
  plan:
    uses: ochanuco/.github/.github/workflows/deploy-plan.yml@781255530e060ff35b956a9b417d4c4ec6bfa970 # v1.7.1
    permissions:
      contents: read
      actions: read
    with:
      ref: ${{ inputs.ref || 'main' }}
      approval-environment: production-approval
  deploy:
    needs: plan
    uses: ochanuco/.github/.github/workflows/deploy.yml@781255530e060ff35b956a9b417d4c4ec6bfa970 # v1.7.1
    with:
      ref: ${{ needs.plan.outputs.sha }}
      approval-environment: ${{ needs.plan.outputs.approval-environment }}
      op-env-file: .github/deploy/worker.env.op
      working-directory: worker
      run: scripts/deploy.sh production
    secrets: inherit
